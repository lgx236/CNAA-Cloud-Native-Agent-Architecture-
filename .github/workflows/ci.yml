name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
      
      - name: Lint with ruff
        run: |
          ruff check cnaa cloud local --output-format=text
          ruff format --check cnaa cloud local
      
      - name: Type checking with mypy
        run: python -m mypy cnaa cloud local --ignore-missing-imports --no-error-summary
      
      - name: Check for TODO/FIXME comments
        run: |
          echo "Checking for unmarked TODOs..."
          rg "(TODO|FIXME|XXX)" cnaa/ || echo "No unmarked TODOs found"

  build:
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Build package
        run: |
          python -m pip install --upgrade build
          python -m build
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cnas-package-${{ github.sha }}
          path: dist/

  test-suite:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
          pip install pytest-cov
        
      - name: Run unit tests
        run: |
          python3 -m pytest tests/test_*.py -m unit -v --cov=cnaa --cov-report=xml --tb=short
      
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          env_vars: OS=${{ runner.os }},Python=${{ matrix.python-version }}
          fail_ci_if_error: false

  integration-tests:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install -e ".[dev]" pytest-cov
      
      - name: Run integration tests
        run: |
          python3 -m pytest tests/ -m integration -v --tb=long
      
      - name: Run error handling tests
        run: |
          python3 -m pytest tests/test_error_handling.py -v --tb=short
      
      - name: Run configuration validation tests
        run: |
          python3 -m pytest tests/test_configuration_validation.py -v --tb=short

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install security tools
        run: pip install bandit safety
      
      - name: Run Bandit security scanner
        run: bandit -r cnaa cloud local -f json -o bandit-results.json || true
      
      - name: Check dependencies for vulnerabilities
        run: safety check || echo "Vulnerabilities found (non-fatal)"

  performance-baseline:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install -e ".[dev]"
      
      - name: Run performance baseline
        run: |
          if [ -f tests/test_performance_baseline.py ]; then
            python3 -m pytest tests/test_performance_baseline.py -v
          else
            echo "Performance tests not present, skipping"
          fi
