name: Production Deploy

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set version from tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          echo "Deploying version: $TAG_VERSION"
      
      - name: Build distribution
        run: |
          python -m pip install --upgrade build
          python -m build
      
      - name: Verify package metadata
        run: |
          tar -tzf dist/*.tar.gz | head -20
          zipinfo dist/*.zip | head -20
      
      - name: Publish to PyPI (if release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
      
      - name: Upload Release Assets (for releases only)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: dist/*
      
      - name: Create release artifacts for tag pushes
        if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'release'
        run: |
          ls -lh dist/
          # Generate changelog summary
          echo "Tagged release created. For full release on GitHub, create a formal release."
