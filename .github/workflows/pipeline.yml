name: Full Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
      
      - name: Run full test suite
        run: python3 -m pytest tests/ -v --tb=long
      
      - name: Security scan
        run: |
          pip install bandit safety
          bandit -r cnaa cloud local || echo "Security scan completed with issues"
          safety check || echo "Dependency vulnerabilities found (check report)"
      
      - name: Build package
        run: python -m build
      
      - name: Store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cnas-package-${{ github.sha }}
          path: dist/

  coverage-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install coverage tools
        run: pip install pytest-cov
      
      - name: Run coverage analysis
        run: |
          python3 -m pytest tests/ --cov=cnaa --cov-report=term-missing
      
      - name: Fail if coverage < 85%
        run: |
          coverage_report=$(python3 -c "import subprocess; result = subprocess.run(['coverage', 'report', '--fail-under=85'], capture_output=True, text=True); print('PASS' if result.returncode == 0 else 'FAIL')")
          if [ "$coverage_report" == "FAIL" ]; then
            echo "Coverage below threshold!"
            exit 1
          fi

  deploy-staging:
    needs: test-and-validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: cnas-package-${{ github.sha }}
          path: dist/
      
      - name: Verify build artifacts
        run: |
          ls -la dist/
          tar -tzf dist/*.tar.gz > /dev/null && echo "✓ Tarball valid"
          zip -q dist/*.zip -d /dev/null && echo "✓ Zip valid" || echo "Note: No zip created"
