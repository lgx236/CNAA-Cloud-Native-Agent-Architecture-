# Pytest configuration for CNAA test suite

[pytest]
# Test discovery settings
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Warning control
filterwarnings =
    error::DeprecationWarning
    error::PendingDeprecationWarning
    ignore::UserWarning
    
# Test execution options
addopts = 
    -v
    --strict-markers
    --tb=short
    --color=yes
    --log-level=INFO
    
# Timeouts per test
timeout = 30

# Maximum failures to report before stopping
maxfail = 5

# Cache directory
cache_dir = .pytest_cache

# Output verbosity
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
